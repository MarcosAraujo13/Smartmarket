<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de compras | Smartmarket</title>
  <link rel="stylesheet" href="css/lista.css">
</head>
<body>
  <header class="topo-lista">
    <a href="index.html" class="voltar">⬅ Voltar ao mapa</a>
    <h1>Minha lista de compras</h1>
  </header>

  <main class="conteudo-lista">
    <!-- Esta parte fica fixa no topo enquanto você rola a lista -->
    <div class="painel-topo">
      <form id="form-item" class="form-item" autocomplete="off">
        <input id="novo-item" type="text"
          placeholder="Digite um item e aperte Enter"
          aria-label="Novo item da lista">
        <button type="submit">Adicionar</button>
      </form>
      <p id="aviso-form" class="aviso-form" aria-live="polite"></p>
      <div id="filtros" class="filtros"></div>
    </div>

    <ul id="resultado-lista" class="lista-tarefas"></ul>

    <div id="acoes-lista" class="acoes-lista" hidden>
      <button type="button" id="btn-limpar-comprados" class="link-botao">Limpar comprados</button>
      <button type="button" id="btn-limpar" class="link-botao perigo">Limpar tudo</button>
    </div>

    <a href="index.html" class="ver-mapa">Ver no mapa</a>
  </main>

  <script src="js/data.js"></script>
  <script src="js/lista.js"></script>
</body>
</html>
